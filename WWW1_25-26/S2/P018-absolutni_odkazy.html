<head>

    <title>Odkazy</title>
    <!--Absolutní URL v hlavičce-->
    <!--U připojených disků funguje, jen pokud je z Vašeho zařízení disk dohledatelný-->
    <link rel="stylesheet" href="S:\WWW1_25-26\S2\P005-stylopis\externi.css">

        S: - kořenový adresář
        \WWW1_25-26\ - podsložky
        externi.css - soubor
    -->
</head>
<body>
    <h1>Ukázka připojeného CSS přes absolutní URL</h1>

    <h2>Tvorba odkazů v body</h2>

        href - URL 
        target - otevření nového okna (_blank) / otevření odkazu místo současné karty (_self)
    -->
</body>
