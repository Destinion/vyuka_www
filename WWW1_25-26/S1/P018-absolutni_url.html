<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Absolutní URL odkazy</title>
    <!--Absolutní URL v hlavičce-->
    <!--U připojených disků funguje, jen pokud je z Vašeho zařízení disk dohledatelný-->
    <link rel="stylesheet" href="S:\WWW1_25-26\S1\P017-fonty\stylopis.css">
    <!--
        S: - kořenový adresář (nebo disk)
        \WWW1_25-26\ - podsložka
        externi.css - soubor
    -->

</head>
<body>
    <h2>Tvorba odkazů v body</h2>
    <a href="https://skolahostivar.cz/" target="_blank">
        Odkaz na WWW pomocí absolutního URL
    </a>
    <!-- a - párový prvek odkazu v body 
        href - URL 
        target - otevření nového okna (_blank) / otevření odkazu místo současné karty (_self)
    -->
</body>
</html>
